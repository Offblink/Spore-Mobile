name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gradle.properties 带的是本机 7897 代理（dl.google.com DNS 不稳才配的），
      # runner 上没人监听它——不剥掉依赖解析全线卡死。CI 用 runner 直连。
      - name: Strip local proxy
        run: sed -i '/^systemProp\..*proxy/d' gradle.properties

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android：它默认装的 'tools' 包 Google 早删了。
      # runner 镜像带 SDK 但 sdkmanager 不在 PATH（cmdline-tools 是版本化目录）→ 自己定位
      - name: Install platform android-37
        run: |
          SM=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          echo "using $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platforms;android-37.0" > /dev/null

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build + unit tests
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain

      # 单测计数别信退出码，读 XML（仓库惯例：tests/failures/errors 三列）
      - name: Test counts
        if: always()
        run: |
          if ls app/build/test-results/testDebugUnitTest/*.xml >/dev/null 2>&1; then
            grep -h "<testsuite " app/build/test-results/testDebugUnitTest/*.xml \
              | sed -E 's/.*tests="([0-9]+)".*failures="([0-9]+)" errors="([0-9]+)".*/\1 \2 \3/' \
              | awk '{t+=$1; f+=$2; e+=$3} END {print "tests="t" failures="f" errors="e; exit (f+e>0)}'
          fi

      # 解剖 APK：体积/条目/ABI/dex/最大条目——和本地构建对表，防止 CI 产物缺斤短两
      - name: APK anatomy
        run: |
          python3 - <<'EOF'
          import os, zipfile
          p = 'app/build/outputs/apk/debug/app-debug.apk'
          z = zipfile.ZipFile(p)
          infos = z.infolist()
          print('size =', os.path.getsize(p), '| entries =', len(infos),
                '| stored =', sum(1 for i in infos if i.compress_type == 0))
          print('abis =', sorted({n.split('/')[1] for n in z.namelist()
                                  if n.startswith('lib/')}))
          dex = [n for n in z.namelist() if n.endswith('.dex')]
          print('dex =', len(dex), 'bytes =', sum(z.getinfo(d).file_size for d in dex))
          for i in sorted(infos, key=lambda x: -x.file_size)[:12]:
              print('  %10d %s' % (i.file_size, i.filename))
          EOF

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spore-debug
          path: app/build/outputs/apk/debug/app-debug.apk
