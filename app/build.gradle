plugins {
    alias(libs.plugins.android.application)
}

// 本机密钥注入：app/secrets.properties（gitignore）→ BuildConfig.SPORE_API_KEY。
// 红线同桌面（handoff §7）：真实 key 绝不进 git；文件不存在时构建照常、key 为空。
def secretsFile = new File(rootProject.projectDir, 'secrets.properties')
def sporeApiKey = ''
if (secretsFile.exists()) {
    def props = new Properties()
    secretsFile.withInputStream { props.load(it) }
    sporeApiKey = props.getProperty('sporeApiKey', '')
}

android {
    testOptions {
        // 单测里 android.jar 走桩默认值（Handler/Looper 不抛）；断言全在纯 Java 逻辑上
        unitTests.returnDefaultValues = true
    }

    namespace 'org.offblink.spore'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "org.offblink.spore"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField 'String', 'SPORE_API_KEY',
                "\"${sporeApiKey.replace('\\', '\\\\').replace('"', '\\\"')}\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.okhttp
    implementation libs.recyclerview
    implementation libs.mlkit.chinese
    implementation libs.markwon
    implementation libs.markwon.ext.tables
    implementation libs.markwon.ext.latex
    implementation libs.jlatexmath.android
    // 扫码配对：CameraX 预览+帧分析 + ML Kit QR 解码（bundled）
    implementation libs.camera.core
    implementation libs.camera.camera2
    implementation libs.camera.lifecycle
    implementation libs.camera.view
    implementation libs.barcode.scanning

    testImplementation libs.junit
    testImplementation libs.json
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}
