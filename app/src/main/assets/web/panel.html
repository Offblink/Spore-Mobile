<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="spore.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div id="root">
  <div id="hd">
    <button id="sessions" title="会话列表">💬<span class="dot"></span></button>
    <button id="fav" title="收藏此会话">★</button>
    <div id="title"></div>
    <div id="status"></div>
    <button class="mini" id="stop" title="停止">■</button>
    <button class="mini" id="min" title="收起">—</button>
  </div>

  <div id="stream"></div>

  <div id="composer">
    <textarea id="input" rows="1" placeholder="追问…"></textarea>
    <button id="send" title="发送">↑</button>
  </div>

  <div id="listpop"></div>

  <div id="confirm" class="modal-mask">
    <div class="modal-box">
      <div class="modal-title">删除会话</div>
      <div class="modal-body">确定删除「<b id="confirmName"></b>」吗？<br>截图、回答与思考记录会一并删除，不可恢复。</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirmNo" type="button">取消</button>
        <button class="btn btn-danger" id="confirmYes" type="button">删除</button>
      </div>
    </div>
  </div>

  <div id="rename" class="modal-mask">
    <div class="modal-box">
      <div class="modal-title">重命名会话</div>
      <input id="renameInput" class="input" type="text" maxlength="60" spellcheck="false">
      <div class="modal-actions" style="margin-top:16px">
        <button class="btn btn-ghost" id="renameNo" type="button">取消</button>
        <button class="btn btn-primary" id="renameYes" type="button">保存</button>
      </div>
    </div>
  </div>
</div>

<script src="common.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="md.js"></script>
<script src="panel.js"></script>
</body>
</html>
