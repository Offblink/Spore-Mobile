<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>搜题记录</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<link rel="stylesheet" href="spore.css">
<link rel="stylesheet" href="navbar.css">
<link rel="stylesheet" href="record.css">
<!-- navboot 必须同步放在 head：要在首帧前把来源 tab 落到 <html>（否则胶囊先在终点闪一下） -->
<script src="navboot.js"></script>
</head>
<body data-tab="records">

<!-- ============ 列表视图（一滑到底长页面，无分页） ============ -->
<div id="listView">
  <header class="topbar">
    <button class="icon" id="btnBack" type="button">‹</button>
    <h1 class="ptitle" id="ptitle">搜题记录</h1>
    <div class="scope">
      <span class="scope-label on" id="labelAll">全部</span>
      <button class="switch" id="scopeSwitch" type="button" aria-label="全部/收藏筛选"></button>
      <span class="scope-label" id="labelFav">收藏</span>
    </div>
    <!-- 多选模式：顶栏右侧换成「取消」（退出多选），筛选开关让位 -->
    <button class="selx" id="selCancel" type="button">取消</button>
  </header>

  <div class="largetitle" id="bigTitle">搜题记录</div>

  <div class="chips" id="subBar">
    <button class="fchip on" data-sub="" type="button">未分组</button>
    <!-- 分组 chips 由 JS 全量重建：未分组 + 各科目（没有「全部」）；新建/改名/删除统一在行内 ⇥ 移入弹层里做（第三轮反馈：顶栏只留筛选 -->
  </div>

  <div id="rows" class="rows"></div>
  <div id="empty" class="empty" hidden>暂无搜题记录</div>

  <!-- 多选底栏：长按卡片进入多选后浮出（收藏/移入科目/删除批量操作） -->
  <footer class="batchbar" id="batchbar" hidden>
    <span class="bcount" id="selCount">已选 0</span>
    <button class="bbtn" id="bFav" type="button">★ 收藏</button>
    <button class="bbtn" id="bMove" type="button">移入科目</button>
    <button class="bbtn danger" id="bDel" type="button">删除</button>
  </footer>

  <!-- 页内模态：层级最高；成功只关模态、列表原地刷新（第四轮反馈） -->
  <!-- 移入科目：科目单选列表（行内菜单形态，用户拍板非拖拽）；空表时 JS 渲染「先新建」提示。
       必须排在 #confirm/#rename 之前：三者同 z-index，靠 DOM 序层叠，删除/重命名要压在它上面 -->
  <div id="subpick" class="modal-mask">
    <div class="modal-box">
      <!-- 刻痕做成真元素（原 ::before）：下滑手势要有可命中的抓手 + touch-action:none -->
      <div class="grab" id="pickGrab"></div>
      <div class="modal-title" id="pickTitle">移入科目</div>
      <div class="sublist" id="subPickList"></div>
      <div class="modal-actions" style="margin-top:16px">
        <button class="btn btn-ghost" id="subPickNo" type="button">取消</button>
        <button class="btn btn-soft" id="subPickNew" type="button">＋ 新建科目</button>
      </div>
    </div>
  </div>

  <div id="confirm" class="modal-mask">
    <div class="modal-box">
      <div class="modal-title" id="confirmTitle">删除会话</div>
      <div class="modal-body" id="confirmBody">确定删除「<b id="confirmName"></b>」吗？<br>截图、回答与思考记录会一并删除，不可恢复。</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirmNo" type="button">取消</button>
        <button class="btn btn-danger" id="confirmYes" type="button">删除</button>
      </div>
    </div>
  </div>

  <div id="rename" class="modal-mask">
    <div class="modal-box">
      <div class="modal-title" id="renameTitle">重命名会话</div>
      <input id="renameInput" class="input" type="text" maxlength="60" spellcheck="false">
      <div class="modal-actions" style="margin-top:16px">
        <button class="btn btn-ghost" id="renameNo" type="button">取消</button>
        <button class="btn btn-primary" id="renameYes" type="button">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ 独立会话详情视图（点行进入，不再借悬浮抽屉——第四轮反馈2①） ============ -->
<div id="detailView" hidden>
  <header class="topbar">
    <button class="icon" id="dBack" type="button">‹</button>
    <div class="ptitle" id="dTitle"></div>
    <button class="icon star" id="dFav" type="button">★</button>
  </header>

  <div id="dStream" class="dstream"></div>

  <footer class="dfoot">
    <div class="composer">
      <input id="dInput" class="input" type="text" placeholder="追问…">
      <button id="dSend" class="send" type="button">↑</button>
    </div>
  </footer>
</div>

<!-- 底栏（M3 胶囊指示器配方）：当前页 = 记录。详情视图/多选模式会收起它，见 record.css -->
<nav class="tabbar" aria-label="页面切换">
  <span class="tab-pill" aria-hidden="true"></span>
  <button type="button" class="tabitem" data-tab="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 11l9-8 9 8" />
      <path d="M5 10v10h14V10" />
    </svg>
    <span class="tab-lab">首页</span>
  </button>
  <button type="button" class="tabitem on" data-tab="records">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
    </svg>
    <span class="tab-lab">记录</span>
  </button>
  <button type="button" class="tabitem" data-tab="settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3" />
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
    </svg>
    <span class="tab-lab">设置</span>
  </button>
</nav>

<script src="common.js"></script>
<script src="vendor/katex/katex.min.js"></script>
<script src="md.js"></script>
<script src="navbar.js"></script>
<script src="record.js"></script>
</body>
</html>
