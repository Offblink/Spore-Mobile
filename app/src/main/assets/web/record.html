<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>搜题记录</title>
<link rel="stylesheet" href="spore.css">
<link rel="stylesheet" href="record.css">
</head>
<body>

<!-- ============ 列表视图（一滑到底长页面，无分页） ============ -->
<div id="listView">
  <header class="topbar">
    <button class="icon" id="btnBack" type="button">‹</button>
    <h1 class="ptitle" id="ptitle">搜题记录</h1>
    <div class="scope">
      <span class="scope-label on" id="labelAll">全部</span>
      <button class="switch" id="scopeSwitch" type="button" aria-label="全部/收藏筛选"></button>
      <span class="scope-label" id="labelFav">收藏</span>
    </div>
    <!-- 多选模式：顶栏右侧换成「取消」（退出多选），筛选开关让位 -->
    <button class="selx" id="selCancel" type="button">取消</button>
  </header>

  <div class="largetitle" id="bigTitle">搜题记录</div>

  <div class="chips" id="subBar">
    <button class="fchip on" data-sub="" type="button">全部</button>
    <!-- 科目 chips 由 JS 全量重建；新建/改名/删除统一在行内 ⇥ 移入弹层里做（第三轮反馈：顶栏只留筛选 -->
  </div>

  <div id="rows" class="rows"></div>
  <div id="empty" class="empty" hidden>暂无搜题记录</div>

  <!-- 多选底栏：长按卡片进入多选后浮出（收藏/移入科目/删除批量操作） -->
  <footer class="batchbar" id="batchbar" hidden>
    <span class="bcount" id="selCount">已选 0</span>
    <button class="bbtn" id="bFav" type="button">★ 收藏</button>
    <button class="bbtn" id="bMove" type="button">移入科目</button>
    <button class="bbtn danger" id="bDel" type="button">删除</button>
  </footer>

  <!-- 页内模态：层级最高；成功只关模态、列表原地刷新（第四轮反馈） -->
  <!-- 移入科目：科目单选列表（行内菜单形态，用户拍板非拖拽）；空表时 JS 渲染「先新建」提示。
       必须排在 #confirm/#rename 之前：三者同 z-index，靠 DOM 序层叠，删除/重命名要压在它上面 -->
  <div id="subpick" class="modal-mask">
    <div class="modal-box">
      <div class="modal-title" id="pickTitle">移入科目</div>
      <div class="sublist" id="subPickList"></div>
      <div class="modal-actions" style="margin-top:16px">
        <button class="btn btn-ghost" id="subPickNo" type="button">取消</button>
        <button class="btn btn-soft" id="subPickNew" type="button">＋ 新建科目</button>
      </div>
    </div>
  </div>

  <div id="confirm" class="modal-mask">
    <div class="modal-box">
      <div class="modal-title" id="confirmTitle">删除会话</div>
      <div class="modal-body" id="confirmBody">确定删除「<b id="confirmName"></b>」吗？<br>截图、回答与思考记录会一并删除，不可恢复。</div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="confirmNo" type="button">取消</button>
        <button class="btn btn-danger" id="confirmYes" type="button">删除</button>
      </div>
    </div>
  </div>

  <div id="rename" class="modal-mask">
    <div class="modal-box">
      <div class="modal-title" id="renameTitle">重命名会话</div>
      <input id="renameInput" class="input" type="text" maxlength="60" spellcheck="false">
      <div class="modal-actions" style="margin-top:16px">
        <button class="btn btn-ghost" id="renameNo" type="button">取消</button>
        <button class="btn btn-primary" id="renameYes" type="button">保存</button>
      </div>
    </div>
  </div>
</div>

<!-- ============ 独立会话详情视图（点行进入，不再借悬浮抽屉——第四轮反馈2①） ============ -->
<div id="detailView" hidden>
  <header class="topbar">
    <button class="icon" id="dBack" type="button">‹</button>
    <div class="ptitle" id="dTitle"></div>
    <button class="icon star" id="dFav" type="button">★</button>
  </header>

  <div id="dStream" class="dstream"></div>

  <footer class="dfoot">
    <div class="composer">
      <input id="dInput" class="input" type="text" placeholder="追问…">
      <button id="dSend" class="send" type="button">↑</button>
    </div>
  </footer>
</div>

<script src="common.js"></script>
<script src="md.js"></script>
<script src="record.js"></script>
</body>
</html>
