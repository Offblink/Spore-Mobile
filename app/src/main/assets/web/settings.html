<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        try {
          var t = window.Spore && window.Spore.theme ? window.Spore.theme() : null;
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) { /* 主题只是外观，失败就留浅色 */ }
      })();
    </script>
    <title>Spore 设置</title>
    <link rel="stylesheet" href="spore.css" />
    <link rel="stylesheet" href="navbar.css" />
    <link rel="stylesheet" href="glassbar.css" />
    <link rel="stylesheet" href="settings.css" />
    <!-- navboot 必须同步放在 head：要在首帧前把来源 tab 落到 <html>（否则新页先在终点亮一下再滑进来） -->
    <script src="navboot.js"></script>
  </head>
  <body data-tab="settings">
    <!-- 顶栏：‹（裸箭头，同搜题记录页；桥 close → 原生 finish + 反向转场）+ 页面标题 -->
    <header class="topbar">
      <button type="button" class="back-btn" id="btnBack">‹</button>
      <span class="title">设置</span>
    </header>

    <main class="form sheet">
      <!-- 外观（即时生效，不用按保存） -->
      <section class="card group">
        <div class="group-title">外观</div>
        <div class="segmented" id="themeSeg" role="group" aria-label="主题">
          <i class="seg-ind" id="segInd" aria-hidden="true"></i>
          <button type="button" class="seg" data-theme-mode="system">跟随系统</button>
          <button type="button" class="seg" data-theme-mode="light">浅色</button>
          <button type="button" class="seg" data-theme-mode="dark">深色</button>
        </div>
        <div class="hint">浅色 = 孢子粉，深色 = Fungi 青；点一下立即换，所有页面同步</div>
      </section>

      <!-- 模型与密钥 -->
      <section class="card group">
        <div class="group-title">模型与密钥</div>

        <div class="field">
          <label for="endpoint">接口地址</label>
          <input
            id="endpoint"
            class="input"
            type="url"
            spellcheck="false"
            autocomplete="off"
            placeholder="https://api.deepseek.com/chat/completions"
          />
          <div class="hint">OpenAI 兼容 endpoint</div>
        </div>

        <div class="field">
          <label for="model">模型</label>
          <input id="model" class="input" type="text" spellcheck="false" autocomplete="off" />
        </div>

        <div class="field">
          <label for="apiKey">API Key</label>
          <div class="key-wrap">
            <input id="apiKey" class="input" type="password" spellcheck="false" autocomplete="off" />
            <button type="button" class="eye" id="keyEye" aria-label="显示或隐藏 Key">👁</button>
          </div>
          <div class="hint">仅存本机，不会进日志</div>
        </div>
      </section>

      <!-- 检索 -->
      <section class="card group">
        <div class="group-title">检索</div>

        <div class="field">
          <label for="proxy">检索代理</label>
          <input
            id="proxy"
            class="input"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="留空=只走 bing · 如 127.0.0.1:7897"
          />
          <div class="hint">填了 = ddg → bing → brave；留空 = 只走 bing</div>
        </div>

        <div class="field">
          <label for="maxToolRounds">最大工具轮数</label>
          <input id="maxToolRounds" class="input" type="number" min="0" max="10" inputmode="numeric" />
          <div class="hint">默认 5 · 0 = 不核实</div>
        </div>
      </section>

      <!-- 作答 -->
      <section class="card group">
        <div class="group-title">作答</div>

        <div class="field">
          <label for="historyLimit">历史记录条数</label>
          <input id="historyLimit" class="input" type="number" min="2" max="50" inputmode="numeric" />
          <div class="hint">默认 10</div>
        </div>

        <button type="button" class="switch-row">
          <span class="txt"
            >初答直接作答、不写推理
            <span class="sub">更快；核实与追问仍会显示思考过程</span></span
          >
          <span class="switch" id="swFastNoThink"></span>
        </button>

        <button type="button" class="switch-row">
          <span class="txt"
            >自动核实
            <span class="sub">答完自动联网核实；关掉后回答里出现「核实一下」按钮，点它才核实</span></span
          >
          <span class="switch" id="swAutoVerify"></span>
        </button>

      </section>

      <!-- 服务器与同步（2026-11：删桌面扫码配对与账号口令直连，统一为扫码登录） -->
      <section class="card group">
        <div class="group-title">服务器与同步</div>

        <div class="field">
          <div class="sync-state" id="syncState">未登录</div>
          <div class="hint" id="syncHint">扫服务器登录页上的二维码（记录与科目双向同步）</div>
        </div>

        <div class="sync-btns">
          <button type="button" class="btn btn-soft" id="btnQr">扫码登录</button>
          <button type="button" class="btn btn-primary" id="btnSync" disabled>立即同步</button>
          <button type="button" class="btn btn-danger" id="btnUnpair" hidden>退出登录</button>
        </div>
      </section>

      <!-- 运行日志：只留入口，正文与刷新/复制/清空在独立页（LogActivity + logs.html） -->
      <section class="card group log-entry">
        <button type="button" class="nav-row" id="btnLogs">
          <span class="nav-row-txt">
            <span class="nav-row-t">运行日志</span>
            <span class="nav-row-s">同步 / 配对的逐步时序，点开查看</span>
          </span>
          <span class="nav-row-arrow" aria-hidden="true">›</span>
        </button>
      </section>

      <button type="button" class="btn btn-primary save" id="btnSave">保存</button>
    </main>

    <!-- 底部玻璃导航条：浮在内容上的控件层，必须在 .sheet 之外 + position: fixed -->
    <nav class="lg-tabbar" aria-label="页面切换">
      <button type="button" class="lg-tab" data-tab="home">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 11.2L12 3l9 8.2V21h-6v-6H9v6H3z" /></svg>
        <span class="lg-lb">首页</span>
      </button>
      <button type="button" class="lg-tab" data-tab="records">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19V6a2 2 0 012-2h12v15H6a2 2 0 00-2 2z" /><path d="M8 8h6M8 12h6" /></svg>
        <span class="lg-lb">记录</span>
      </button>
      <button type="button" class="lg-tab on" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.6 1.6 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
        <span class="lg-lb">设置</span>
      </button>
    </nav>

    <script src="common.js"></script>
    <script src="navbar.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
