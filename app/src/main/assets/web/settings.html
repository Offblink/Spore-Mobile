<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Spore 设置</title>
    <link rel="stylesheet" href="spore.css" />
    <link rel="stylesheet" href="navbar.css" />
    <link rel="stylesheet" href="settings.css" />
    <!-- navboot 必须同步放在 head：要在首帧前把来源 tab 落到 <html>（否则胶囊先在终点闪一下） -->
    <script src="navboot.js"></script>
  </head>
  <body data-tab="settings">
    <!-- 顶栏：‹（裸箭头，同搜题记录页；桥 close → 原生 finish + 反向转场）+ 页面标题 -->
    <header class="topbar">
      <button type="button" class="back-btn" id="btnBack">‹</button>
      <span class="title">设置</span>
    </header>

    <main class="form sheet">
      <!-- 模型与密钥 -->
      <section class="card group">
        <div class="group-title">模型与密钥</div>

        <div class="field">
          <label for="endpoint">接口地址</label>
          <input
            id="endpoint"
            class="input"
            type="url"
            spellcheck="false"
            autocomplete="off"
            placeholder="https://api.deepseek.com/chat/completions"
          />
          <div class="hint">OpenAI 兼容 endpoint</div>
        </div>

        <div class="field">
          <label for="model">模型</label>
          <input id="model" class="input" type="text" spellcheck="false" autocomplete="off" />
        </div>

        <div class="field">
          <label for="apiKey">API Key</label>
          <div class="key-wrap">
            <input id="apiKey" class="input" type="password" spellcheck="false" autocomplete="off" />
            <button type="button" class="eye" id="keyEye" aria-label="显示或隐藏 Key">👁</button>
          </div>
          <div class="hint">仅存本机，不会进日志</div>
        </div>
      </section>

      <!-- 检索 -->
      <section class="card group">
        <div class="group-title">检索</div>

        <div class="field">
          <label for="proxy">检索代理</label>
          <input
            id="proxy"
            class="input"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="留空=只走 bing · 如 127.0.0.1:7897"
          />
          <div class="hint">填了 = ddg → bing → brave；留空 = 只走 bing</div>
        </div>

        <div class="field">
          <label for="maxToolRounds">最大工具轮数</label>
          <input id="maxToolRounds" class="input" type="number" min="0" max="10" inputmode="numeric" />
          <div class="hint">默认 5 · 0 = 不核实</div>
        </div>
      </section>

      <!-- 作答 -->
      <section class="card group">
        <div class="group-title">作答</div>

        <div class="field">
          <label for="historyLimit">历史记录条数</label>
          <input id="historyLimit" class="input" type="number" min="2" max="50" inputmode="numeric" />
          <div class="hint">默认 10</div>
        </div>

        <button type="button" class="switch-row">
          <span class="txt"
            >初答直接作答、不写推理
            <span class="sub">更快；核实与追问仍会显示思考过程</span></span
          >
          <span class="switch" id="swFastNoThink"></span>
        </button>

        <button type="button" class="switch-row">
          <span class="txt"
            >自动核实
            <span class="sub">答完自动联网核实；关掉后回答里出现「核实一下」按钮，点它才核实</span></span
          >
          <span class="switch" id="swAutoVerify"></span>
        </button>

        <button type="button" class="switch-row">
          <span class="txt"
            >AI 建议框
            <span class="sub"
              >截屏后本机识别文字、自动预选题目区域；认不出字会提示重试。默认关＝纯手动拖框</span
            ></span
          >
          <span class="switch" id="swMlSuggest"></span>
        </button>

        <div class="field">
          <label>悬浮面板渲染</label>
          <label class="pradio"
            ><input type="radio" name="panelRender" value="web" /> WebView（默认）</label
          >
          <label class="pradio"
            ><input type="radio" name="panelRender" value="native" /> 原生（备选皮）</label
          >
          <div class="hint">改完重启悬浮球生效；崩溃根因已修，两皮通用</div>
        </div>
      </section>

      <!-- 配对与同步 -->
      <section class="card group">
        <div class="group-title">配对与同步</div>

        <div class="field">
          <div class="sync-state" id="syncState">未配对</div>
          <div class="hint" id="syncHint">扫码接入 Spore 桌面端（记录与科目双向同步）</div>
        </div>

        <div class="sync-btns">
          <button type="button" class="btn btn-soft" id="btnScan">扫码配对</button>
          <button type="button" class="btn btn-primary" id="btnSync" disabled>立即同步</button>
          <button type="button" class="btn btn-danger" id="btnUnpair" hidden>取消配对</button>
        </div>
      </section>

      <!-- 日志（三端对齐：MV3 主页日志卡 / GUI 日志页 / 这里的设置底部日志卡） -->
      <section class="card group">
        <div class="group-title">日志</div>
        <div class="field">
          <div class="hint">同步/配对的逐步时序，尾部 64KB 环形；红线：不记 token 与 key</div>
          <pre id="logBody" class="logbody">（空）</pre>
        </div>
        <div class="sync-btns">
          <button type="button" class="btn btn-soft" id="btnLogRefresh">刷新</button>
          <button type="button" class="btn btn-soft" id="btnLogCopy">复制</button>
          <button type="button" class="btn btn-danger" id="btnLogClear">清空</button>
        </div>
      </section>

      <button type="button" class="btn btn-primary save" id="btnSave">保存</button>
    </main>

    <!-- 底栏（M3 胶囊指示器配方）：当前页 = 设置 -->
    <nav class="tabbar" aria-label="页面切换">
      <span class="tab-pill" aria-hidden="true"></span>
      <button type="button" class="tabitem" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 11l9-8 9 8" />
          <path d="M5 10v10h14V10" />
        </svg>
        <span class="tab-lab">首页</span>
      </button>
      <button type="button" class="tabitem" data-tab="records">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
        <span class="tab-lab">记录</span>
      </button>
      <button type="button" class="tabitem on" data-tab="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3" />
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
        <span class="tab-lab">设置</span>
      </button>
    </nav>

    <script src="common.js"></script>
    <script src="navbar.js"></script>
    <script src="settings.js"></script>
  </body>
</html>
