[versions]
agp = "9.3.3"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
okhttp = "4.12.0"
recyclerview = "1.3.2"
mlkit = "16.0.1"
# 原生面板 markdown 渲染（第五轮 fork 回仓的 round-3 依赖）
markwon = "4.6.2"
# ext-latex 的渲染后端（JLaTeXMath 的 Android 移植）
jlatexmath = "0.2.0"
# 扫码配对：CameraX 预览/分析 + ML Kit 条码（bundled 模型进 APK，不依赖 GMS——同中文识别口径）
camerax = "1.6.2"
barcode = "17.3.0"
# 只进 testImplementation：单测里要真 org.json（mockable android.jar 的 JSONObject 不可用）。
# 钉 LlmClient.wireStr 契约（Android optString 把 JSON null 变 "null" 的坑）。
json = "20240303"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
# bundled 中文识别（模型打进 APK，不依赖 GMS——华为路径的正解，handoff §10）
mlkit-chinese = { group = "com.google.mlkit", name = "text-recognition-chinese", version.ref = "mlkit" }
# 注意：io.noties:markwon 在 Central 是 404，坐标必须是 io.noties.markwon:core
markwon = { group = "io.noties.markwon", name = "core", version.ref = "markwon" }
# 原生面板的两块格式缺口：表格（ext-tables）与公式（ext-latex，渲染靠 jlatexmath-android）
markwon-ext-tables = { group = "io.noties.markwon", name = "ext-tables", version.ref = "markwon" }
markwon-ext-latex = { group = "io.noties.markwon", name = "ext-latex", version.ref = "markwon" }
jlatexmath-android = { group = "ru.noties", name = "jlatexmath-android", version.ref = "jlatexmath" }
camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "barcode" }
json = { group = "org.json", name = "json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
