[versions]
agp = "9.3.3"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
appcompat = "1.6.1"
material = "1.10.0"
okhttp = "4.12.0"
recyclerview = "1.3.2"
mlkit = "16.0.1"
# 只进 testImplementation：单测里要真 org.json（mockable android.jar 的 JSONObject 不可用）。
# 钉 LlmClient.wireStr 契约（Android optString 把 JSON null 变 "null" 的坑）。
json = "20240303"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
# bundled 中文识别（模型打进 APK，不依赖 GMS——华为路径的正解，handoff §10）
mlkit-chinese = { group = "com.google.mlkit", name = "text-recognition-chinese", version.ref = "mlkit" }
json = { group = "org.json", name = "json", version.ref = "json" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
